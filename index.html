<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        :root {
            --primary-pink: #ee9ca7;
            --secondary-pink: #ffdde1;
            --text-color: #5a1a2c;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, var(--secondary-pink), var(--primary-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Georgia", serif;
            color: var(--text-color);
            overflow: hidden; /* Prevents scrollbars from hearts */
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            top: -10%;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            max-width: 85%;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        h1 { margin-bottom: 1rem; font-size: 1.6rem; opacity: 0.8; }
        p { font-size: 1.3rem; line-height: 1.6; font-weight: 500; }
        
        .main-heart {
            font-size: 2.5rem;
            margin-top: 1.5rem;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Every Day, You 🤍</h1>
        <p id="message">Finding the right words...</p>
        <div class="main-heart">❤️</div>
    </div>

    <script>
        const messages = {
            "02-08": "Loving you isn’t something I schedule — it’s something I live, every single day.",
            "02-09": "Some people wait for a special date. I choose you on ordinary days too.",
            "02-10": "You make the quiet days warmer and the loud days softer.",
            "02-11": "My favorite routine is knowing you’re there.",
            "02-12": "Love isn’t a moment. It’s the way you stay.",
            "02-13": "Tomorrow is famous for love — but you’ve had my heart long before it.",
            "02-14": "Happy Valentine’s Day. Today I celebrate you out loud, like I do quietly every day."
        };

        // Set the message
        const today = new Date();
        const key = today.toLocaleDateString("en-US", { month: "2-digit", day: "2-digit" }).replace("/", "-");
        document.getElementById("message").textContent = messages[key] || "No matter the date — you are loved.";

        // Create background floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
