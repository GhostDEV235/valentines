<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        :root {
            --primary-pink: #ee9ca7;
            --secondary-pink: #ffdde1;
            --text-color: #5a1a2c;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, var(--secondary-pink), var(--primary-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Georgia", serif;
            color: var(--text-color);
            overflow: hidden; /* Prevents scrollbars from hearts */
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            top: -10%;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            user-select: none;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 30px;
            max-width: 85%;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        h1 { margin-bottom: 1rem; font-size: 1.6rem; opacity: 0.8; }
        p { font-size: 1.3rem; line-height: 1.6; font-weight: 500; }

        .btn {
            margin-top: 1.5rem;
            padding: 0.7rem 1.4rem;
            border: none;
            border-radius: 999px;
            background: #ffffff;
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(0,0,0,0.12); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .main-heart {
            font-size: 2.5rem;
            margin-top: 1.5rem;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        /* Fireworks (shown on 02/14) */
        .fireworks {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .fireworks.show { opacity: 1; }

        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
            animation: burst 1.6s ease-out infinite;
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.9),
                0 0 24px rgba(255, 200, 220, 0.9),
                0 0 36px rgba(255, 160, 200, 0.9);
        }

        .spark:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .spark:nth-child(2) { top: 25%; left: 70%; animation-delay: 0.3s; }
        .spark:nth-child(3) { top: 55%; left: 35%; animation-delay: 0.6s; }
        .spark:nth-child(4) { top: 65%; left: 75%; animation-delay: 0.9s; }
        .spark:nth-child(5) { top: 40%; left: 50%; animation-delay: 1.2s; }

        @keyframes burst {
            0% { transform: scale(0.2); opacity: 0; }
            20% { opacity: 1; }
            70% { transform: scale(1.6); opacity: 0.6; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .all-quotes {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-align: left;
            max-height: 220px;
            overflow: auto;
        }

        .all-quotes h2 {
            margin: 0 0 0.6rem 0;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .all-quotes ul {
            margin: 0;
            padding-left: 1.2rem;
        }

        .all-quotes li {
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .all-quotes li strong {
            display: block;
            margin-bottom: 0.1rem;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Every Day, You — Habiba 🤍</h1>
        <p id="message">Finding the right words...</p>
        <button id="newQuoteBtn" class="btn" type="button">Show Today’s Quote</button>
        <div class="main-heart">❤️</div>
        <div class="all-quotes">
            <h2>All Daily Quotes (02/08–02/14/2026)</h2>
            <ul id="allQuotesList"></ul>
        </div>
    </div>
    <div id="fireworks" class="fireworks" aria-hidden="true">
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
        <span class="spark"></span>
    </div>

    <script>
        const messages = {
            "02-08": [
                "Loving you isn’t something I schedule — it’s something I live, every single day.",
                "If today is ordinary, then let my love make it extraordinary."
            ],
            "02-09": [
                "Some people wait for a special date. I choose you on ordinary days too.",
                "My favorite part of today is that it includes you."
            ],
            "02-10": [
                "You make the quiet days warmer and the loud days softer.",
                "Even the simplest moments feel sweet with you in them."
            ],
            "02-11": [
                "My favorite routine is knowing you’re there.",
                "If love had a habit, it would look like us."
            ],
            "02-12": [
                "Love isn’t a moment. It’s the way you stay.",
                "I love you in the tiny seconds that make up a day."
            ],
            "02-13": [
                "Tomorrow is famous for love — but you’ve had my heart long before it.",
                "We do not need a holiday to be my favorite."
            ],
            "02-14": [
                "Happy Valentine’s Day, Habiba — our 1-year anniversary. One year of us, and my heart is even more yours.",
                "A year ago you became my favorite place to be. Today, I love you deeper, softer, and forever."
            ]
        };

        const btn = document.getElementById("newQuoteBtn");
        const messageEl = document.getElementById("message");
        const today = new Date();
        const key = today.toLocaleDateString("en-US", { month: "2-digit", day: "2-digit" }).replace("/", "-");
        const todayMessages = messages[key];

        const storageKey = "quotesViewedByDay";
        const limitPerDay = 2;

        function getTodayCount() {
            const raw = localStorage.getItem(storageKey);
            const data = raw ? JSON.parse(raw) : {};
            const count = Number(data[key] || 0);
            return { data, count };
        }

        function setTodayCount(data, count) {
            data[key] = count;
            localStorage.setItem(storageKey, JSON.stringify(data));
        }

        function refreshButtonState() {
            const { count } = getTodayCount();
            if (!todayMessages) {
                btn.disabled = true;
                btn.textContent = "Quotes run 02/08–02/14/2026";
                return;
            }
            if (count >= limitPerDay) {
                btn.disabled = true;
                btn.textContent = "Come back tomorrow";
            } else {
                btn.disabled = false;
                btn.textContent = count === 0 ? "Show Today’s Quote" : "Show Another Quote";
            }
        }

        if (todayMessages) {
            messageEl.textContent = "Tap the button to reveal today’s quote, Habiba.";
        } else {
            messageEl.textContent = "Quotes are available from 02/08 to 02/14/2026.";
        }

        btn.addEventListener("click", () => {
            const { data, count } = getTodayCount();
            if (!todayMessages || count >= limitPerDay) return;
            const nextMessage = todayMessages[Math.min(count, todayMessages.length - 1)];
            messageEl.textContent = nextMessage;
            setTodayCount(data, count + 1);
            refreshButtonState();
        });

        refreshButtonState();

        // Fireworks for 02/14
        const fireworks = document.getElementById("fireworks");
        if (key === "02-14") {
            fireworks.classList.add("show");
        }

        // Render full list of daily quotes
        const allQuotesList = document.getElementById("allQuotesList");
        const dateOrder = ["02-08", "02-09", "02-10", "02-11", "02-12", "02-13", "02-14"];
        dateOrder.forEach((dateKey) => {
            const listItem = document.createElement("li");
            const title = document.createElement("strong");
            title.textContent = dateKey.replace("-", "/") + "/2026";
            listItem.appendChild(title);
            const quoteLines = messages[dateKey] || [];
            quoteLines.forEach((q, idx) => {
                const line = document.createElement("div");
                line.textContent = (idx + 1) + ". " + q;
                listItem.appendChild(line);
            });
            allQuotesList.appendChild(listItem);
        });

        // Create background floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
